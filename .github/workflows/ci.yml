name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows VS Code ${{ matrix.vscode }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.90.0', '1.138.0']
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build and test on pinned VS Code
        run: npm test
      - name: Package development VSIX
        run: npm run package:vsix
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-vscode-${{ matrix.vscode }}-${{ github.sha }}
          path: extension/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain installable prototype
        uses: actions/upload-artifact@v4
        with:
          name: charmlet-vscode-${{ matrix.vscode }}-${{ github.sha }}
          path: extension/*.vsix
          if-no-files-found: error
          retention-days: 14