<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src __CSP__ data:; style-src __CSP__; script-src 'nonce-__NONCE__';">
  <link rel="stylesheet" href="__STYLE__">
  <title>Charmlet</title>
</head>
<body>
  <main id="app" aria-label="Charmlet">
    <div id="stage" data-ready="false" data-running="false" data-persisted="true" data-companion-ready="false" data-companion-persisted="true">
      <div id="rig">
        <div id="hanging" hidden>
          <svg id="cord" aria-hidden="true"><path id="thread"></path></svg>
          <span id="anchor" aria-hidden="true"></span>
          <svg id="focus-ring" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <circle class="focus-track" cx="12" cy="12" r="10"></circle>
            <circle id="focus-progress" cx="12" cy="12" r="10" pathLength="100"></circle>
          </svg>
          <button id="charm" type="button" aria-label="Nudge terminal charm" title="Nudge charm" draggable="false">
            <img id="charm-image" src="__CHARM__" alt="" width="72" height="84" draggable="false">
          </button>
        </div>
      </div>
      <button id="restore" type="button" aria-label="Restore charm" title="Restore charm" hidden></button>
    </div>
    <div id="message-card" class="message-card">
      <div class="message-body">
        <div class="message-meta"><span id="card-kind">Fact</span><span id="card-topic">Git</span></div>
        <p id="message-text"></p>
        <p id="message-answer" hidden></p>
        <div class="message-links">
          <button id="reveal-answer" type="button" hidden>Reveal answer</button>
          <button id="message-source" type="button" hidden>Read source</button>
        </div>
      </div>
      <button id="next-message" type="button" aria-label="Next coding message" title="Next coding message"></button>
    </div>
    <div class="tools" role="toolbar" aria-label="Charm controls">
      <div class="identity"><span id="charm-swatch" class="swatch" aria-hidden="true"></span><span id="charm-name">Terminal</span></div>
      <div class="actions">
        <button id="companion-toggle" type="button" aria-label="Companion tools" title="Focus, learning and garden" aria-expanded="false" aria-controls="companion-tools"><span id="care-badge" aria-hidden="true" hidden></span></button>
        <button id="settings-toggle" type="button" aria-label="Charm settings" title="Charm settings" aria-expanded="false" aria-controls="settings"></button>
        <button id="layout-mode" type="button" aria-label="Orbit layout" title="Orbit layout" aria-pressed="false"></button>
        <button id="motion" type="button" role="switch" aria-checked="true" aria-label="Motion" title="Motion"></button>
        <button id="reset" type="button" aria-label="Reset position" title="Reset position"></button>
        <button id="toggle" type="button" aria-label="Hide charm" title="Hide charm"></button>
      </div>
    </div>
    <div id="settings" hidden>
      <label for="charm-select">Charm</label>
      <select id="charm-select" aria-describedby="charm-description"></select>
      <p id="charm-description"></p>
      <label for="size">Size</label>
      <input id="size" type="range" min="60" max="140" step="10" value="100">
      <output id="size-value" for="size">100%</output>
      <label for="cord-length">Cord</label>
      <input id="cord-length" type="range" min="48" step="2" value="126">
      <output id="cord-value" for="cord-length">126 px</output>
      <label class="message-choice"><input id="show-messages" type="checkbox" checked> Show coding messages</label>
      <label class="message-choice"><input id="rotate-messages" type="checkbox" checked> Rotate messages automatically</label>
      <div class="pack-actions">
        <button id="import-pack" type="button">Import charm pack</button>
        <button id="remove-pack" type="button">Remove charm pack</button>
      </div>
    </div>
    <section id="companion-tools" aria-label="Companion tools" hidden>
      <section id="care-cue" aria-label="Gentle reminder" hidden>
        <p id="care-cue-label" role="status" aria-live="polite"></p>
        <p id="care-cue-copy"></p>
        <div class="care-actions"><button id="care-done" type="button">Done</button><button id="care-snooze" type="button">Snooze 10 min</button><button id="care-skip" type="button">Skip</button></div>
      </section>
      <div role="tablist" aria-label="Companion pages">
        <button id="tab-focus" type="button" role="tab" aria-selected="true" aria-controls="focus-panel">Focus</button>
        <button id="tab-learn" type="button" role="tab" aria-selected="false" aria-controls="learn-panel" tabindex="-1">Learn</button>
        <button id="tab-garden" type="button" role="tab" aria-selected="false" aria-controls="garden-panel" tabindex="-1">Garden</button>
      </div>
      <div id="focus-panel" role="tabpanel" aria-labelledby="tab-focus">
        <p id="focus-status" role="status" aria-live="polite">Ready to focus</p>
        <output id="focus-time" aria-label="Timer remaining" aria-live="off">25:00</output>
        <p id="focus-notice" hidden></p>
        <div class="focus-presets"><button id="preset-25" type="button">25 / 5</button><button id="preset-50" type="button">50 / 10</button></div>
        <div class="focus-durations"><label>Focus minutes<input id="focus-minutes" type="number" min="1" max="120" value="25"></label><label>Break minutes<input id="break-minutes" type="number" min="1" max="30" value="5"></label></div>
        <label class="focus-intent-label">One thing to finish<input id="focus-intent" type="text" maxlength="160" placeholder="One small coding win"></label>
        <div class="focus-actions"><button id="focus-start" type="button">Start focus</button><button id="break-start" type="button">Start break</button><button id="focus-pause" type="button" hidden>Pause</button><button id="focus-resume" type="button" hidden>Resume</button><button id="focus-stop" type="button" hidden>Stop</button></div>
        <details id="care-settings">
          <summary>Gentle reminders</summary>
          <div class="care-settings-grid">
            <label class="care-choice"><input id="water-reminder-enabled" type="checkbox"> Water reminder</label>
            <label>Water interval minutes<input id="water-reminder-minutes" type="number" min="15" max="180" value="60"></label>
            <label class="care-choice"><input id="move-reminder-enabled" type="checkbox"> Move reminder</label>
            <label>Move interval minutes<input id="move-reminder-minutes" type="number" min="15" max="180" value="50"></label>
            <label class="care-choice care-defer"><input id="care-defer" type="checkbox" checked> Wait for a break during focus</label>
          </div>
        </details>
      </div>
      <div id="learn-panel" role="tabpanel" aria-labelledby="tab-learn" hidden>
        <label for="feed-mode">Learning mix</label>
        <select id="feed-mode"><option value="mix">Facts + trivia</option><option value="facts">Facts</option><option value="trivia">Trivia</option><option value="encouragement">Encouragement</option></select>
        <p class="companion-hint">60 facts · 30 trivia questions · 80 optional encouragement messages</p>
      </div>
      <div id="garden-panel" role="tabpanel" aria-labelledby="tab-garden" hidden>
        <img id="garden-art" alt="" width="72" height="84">
        <p id="garden-status" role="status" aria-live="polite"></p>
        <progress id="garden-progress" max="11" value="0" aria-label="Garden waterings"></progress>
        <p id="garden-count"></p>
        <div class="garden-actions">
          <button id="garden-plant" type="button">Plant a seed</button>
          <button id="garden-water" type="button">Water plant</button>
          <button id="garden-hang" type="button" hidden>Hang my flower</button>
        </div>
        <p id="garden-availability" class="companion-hint"></p>
        <div id="garden-collection" aria-label="Grown by you"></div>
      </div>
      <p id="companion-feedback" role="status" aria-live="polite" hidden></p>
    </section>
    <div class="readout"><span id="phase" role="status" aria-live="polite">Parked</span><button id="focus-readout" type="button" aria-label="Open focus session">Focus</button><output id="length">126 px</output></div>
  </main>
  <script nonce="__NONCE__" src="__SCRIPT__"></script>
</body>
</html>
